name: Release Merkle Proof Service

on:
  push:
    branches-ignore:
      - '**'
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

jobs:
  docker_build_push:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#merkle-proof-service-}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Dockerhub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            availj/merkle-proof-service:${{ steps.version.outputs.version }}
            availj/merkle-proof-service:latest
          cache-from: |
            type=gha,scope=merkle-proof-service
            type=registry,ref=availj/merkle-proof-service:buildcache
          cache-to: |
            type=gha,scope=merkle-proof-service,mode=max
            type=registry,ref=availj/merkle-proof-service:buildcache,mode=max
